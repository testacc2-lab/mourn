<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="/src/mobile.css" />
<title>profile - mourn.wtf</title>
    <link rel="icon" href="/mounrlogomain.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        :root { --accent: #8b5cf6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #08070c;
            color: #f4f2f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .boot-loader {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #08070c;
            display: grid;
            place-items: center;
            transition: opacity .28s ease;
        }
        .boot-loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        #entry-gate {
            position: fixed;
            inset: 0;
            z-index: 19;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            background: rgba(8, 7, 12, .62);
            backdrop-filter: blur(15px);
            cursor: pointer;
            transition: opacity .34s ease, visibility .34s ease;
        }
        #entry-gate.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #entry-gate-symbol {
            font-size: 46px;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 0 16px rgba(172, 200, 255, .6);
            animation: gatePulse 2s ease-in-out infinite;
        }
        #entry-gate-hint {
            letter-spacing: .18em;
            text-transform: uppercase;
            font-size: 12px;
            color: rgba(255,255,255,.72);
        }
        @keyframes gatePulse {
            0%, 100% { opacity: .6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.12); }
        }
        body:not(.entered) .wrap {
            filter: blur(4px);
            transform: scale(.985);
            pointer-events: none;
        }
        .boot-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f4f2f8;
            font-weight: 700;
            letter-spacing: -.01em;
        }
        .boot-ring {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-size: cover;
            background-position: center;
            filter: brightness(.35) saturate(1.1);
        }
        #bg-video {
            position: fixed;
            inset: 0;
            z-index: -3;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(.35) saturate(1.1);
            display: none;
        }
        #bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(70% 60% at 50% 0%, rgba(139,92,246,.16), transparent 70%), rgba(8,7,12,.55);
        }
        #bg-fx {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        #cursor-canvas {
            position: fixed;
            inset: 0;
            z-index: 25;
            pointer-events: none;
        }
        .fx-particle {
            position: absolute;
            will-change: transform, opacity;
            pointer-events: none;
        }
        .fx-snow {
            background: rgba(255,255,255,.92);
            border-radius: 999px;
            box-shadow: 0 0 8px rgba(255,255,255,.45);
            animation: snow-fall linear infinite;
        }
        .fx-rain {
            width: 1.5px;
            background: linear-gradient(180deg, rgba(185,210,255,.75), rgba(185,210,255,.1));
            border-radius: 999px;
            animation: rain-fall linear infinite;
        }
        .fx-spark {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(220,196,255,.92);
            box-shadow: 0 0 10px rgba(197,145,255,.6);
            animation: sparkle-drift ease-in-out infinite;
        }
        @keyframes snow-fall {
            from { transform: translate3d(0,-12vh,0); opacity: .95; }
            to { transform: translate3d(8vw,110vh,0); opacity: .2; }
        }
        @keyframes rain-fall {
            from { transform: translate3d(0,-16vh,0); opacity: .9; }
            to { transform: translate3d(-2vw,112vh,0); opacity: .2; }
        }
        @keyframes sparkle-drift {
            0%, 100% { transform: translate3d(0,0,0) scale(.8); opacity: .3; }
            50% { transform: translate3d(8px,-24px,0) scale(1.2); opacity: .95; }
        }
        .wrap { width: 100%; max-width: 400px; perspective: 1000px; }
        .card {
            position: relative;
            background: rgba(15,13,22,.66);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 22px;
            padding: 30px 26px 24px;
            text-align: center;
            box-shadow: 0 30px 80px -30px rgba(0,0,0,.75);
            transition: transform .1s ease-out;
            transform-style: preserve-3d;
        }
        .views {
            position: absolute;
            top: 16px;
            right: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: rgba(255,255,255,.5);
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin: 6px auto 14px;
            display: grid;
            place-items: center;
            font-size: 38px;
            font-weight: 800;
            color: #fff;
            background: var(--accent);
            border: 3px solid rgba(139,92,246,.55);
            box-shadow: 0 0 44px -8px rgba(139,92,246,.6);
        }
        .name {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -.02em;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            justify-content: center;
        }
        .name-wrap {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .name-tip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(3px);
            background: rgba(10, 10, 15, 0.82);
            border: 1px solid rgba(172, 200, 255, 0.16);
            color: #c8dcff;
            border-radius: 7px;
            padding: 4px 8px;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity .16s ease, transform .16s ease;
        }
        .name-wrap:hover .name-tip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .name.fx-wave,
        .profile-title.fx-wave {
            animation: name-wave 2s ease-in-out infinite;
        }
        .name.fx-shake,
        .profile-title.fx-shake {
            animation: name-shake .55s ease-in-out infinite;
        }
        @keyframes name-wave {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-1px); }
            75% { transform: translateY(1px); }
        }
        @keyframes name-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-1px); }
            40% { transform: translateX(1px); }
            60% { transform: translateX(-1px); }
            80% { transform: translateX(1px); }
        }
        .badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .badges,
        .profile-badges {
            display: none !important;
        }
        .badge-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 22px;
            padding: 2px 8px 2px 5px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.18);
            background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
            box-shadow: 0 8px 24px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.14);
            backdrop-filter: blur(8px);
        }
        .badge-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.18);
            color: inherit;
            font-size: 9px;
        }
        .badge-icon img {
            width: 10px;
            height: 10px;
            object-fit: contain;
            display: block;
        }
        .badge-icon.badge-fallback {
            font-weight: 900;
            letter-spacing: -.02em;
        }
        .badge-label {
            display: inline;
            font-size: 10px;
            line-height: 1;
            font-weight: 800;
            color: currentColor;
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .handle {
            display: none;
            color: var(--accent);
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
        }
        .claim-notice {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 11px;
            border: 1px solid rgba(192,132,252,.36);
            background: rgba(168,85,247,.14);
            color: #eadfff;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }
        .claim-notice a {
            color: #f3e8ff;
            font-weight: 800;
            text-decoration: underline;
        }
        .loc { color: rgba(255,255,255,.5); font-size: 13px; margin-top: 3px; }
        .loc.typewriter::after {
            content: '|';
            display: inline-block;
            margin-left: 2px;
            opacity: .78;
            animation: blinkCaret .8s infinite;
        }
        @keyframes blinkCaret {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .bio {
            color: rgba(255,255,255,.72);
            font-size: 14px;
            margin-top: 14px;
            line-height: 1.55;
            min-height: 20px;
            white-space: pre-wrap;
        }
        .socials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        .social {
            color: rgba(255,255,255,.75);
            transition: .15s;
            display: grid;
            place-items: center;
        }
        .social:hover { color: var(--accent); transform: translateY(-3px); }
        .social svg { width: 23px; height: 23px; }
        .social img { width: 23px; height: 23px; object-fit: contain; display: block; }
        .social.fx-hover-none:hover { transform: none; }
        .social.fx-hover-pulse:hover { transform: scale(1.1); }
        .social.fx-hover-spin:hover { transform: rotate(9deg) scale(1.04); }
        .link img, .platform-label-tag img, .contact-primary img, .contact-secondary img { width: 16px; height: 16px; object-fit: contain; display: block; }
        .links {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 22px;
        }
        .link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 13px;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            transition: .15s;
            text-decoration: none;
        }
        .link:hover {
            transform: translateY(-2px);
            border-color: rgba(139,92,246,.5);
            background: rgba(139,92,246,.1);
        }
        .link .lu {
            font-size: 12px;
            color: rgba(255,255,255,.45);
            font-weight: 500;
        }
        .music {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 14px;
            padding: 11px;
            margin-top: 22px;
            text-align: left;
        }
        .music {
            display: none !important;
        }
        .music img {
            width: 46px;
            height: 46px;
            border-radius: 9px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1a1725;
        }
        .music .mi { flex: 1; min-width: 0; }
        .music .mt {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music .ma {
            font-size: 12px;
            color: rgba(255,255,255,.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prog {
            height: 3px;
            background: rgba(255,255,255,.12);
            border-radius: 2px;
            margin-top: 7px;
            overflow: hidden;
        }
        .prog span { display: block; height: 100%; width: 0; background: var(--accent); }
        .playbtn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .playbtn:hover { filter: brightness(1.1); }
        .brand { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.4); font-weight: 600; letter-spacing: .03em; }
        .brand span { color: var(--accent); }
        .projects {
            display: none;
            margin-top: 14px;
            gap: 8px;
            flex-direction: column;
        }
        .proj {
            display: block;
            text-decoration: none;
            color: #f4f2f8;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            text-align: left;
        }
        .proj:hover { border-color: rgba(139,92,246,.45); }
        .proj-empty {
            color: rgba(255,255,255,.52);
            font-size: 12px;
            padding: 10px 2px;
            text-align: left;
        }

        body.layout-minimal .card {
            max-width: 420px;
            border-radius: 22px;
            padding: 34px 28px;
            background: rgba(15,13,22,.72);
            backdrop-filter: blur(20px);
        }
        body.layout-minimal .views {
            position: static;
            margin-bottom: 18px;
            gap: 6px;
        }
        body.layout-minimal .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            border-width: 2px;
            box-shadow: 0 0 40px -8px rgba(139,92,246,.5);
        }
        body.layout-minimal .name { font-size: 24px; }
        body.layout-minimal .handle { display: block; }
        body.layout-minimal .loc { display: none; }
        body.layout-minimal .socials {
            gap: 10px;
            margin-top: 20px;
        }
        body.layout-minimal .social {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            color: #fff;
        }
        body.layout-minimal .social:hover {
            background: rgba(139,92,246,.18);
            border-color: rgba(139,92,246,.5);
            transform: translateY(-2px);
            color: #fff;
        }
        body.layout-minimal .social svg { width: 20px; height: 20px; }
        body.layout-minimal .links { display: flex; }
        body.layout-minimal .music {
            margin-top: 22px;
            padding: 12px;
        }
        body.layout-minimal .brand {
            margin-top: 22px;
            font-size: 12px;
            letter-spacing: 0;
        }

        body.layout-scroll .wrap { max-width: 520px; }
        body.layout-scroll .card {
            border-radius: 16px;
            padding: 22px 18px 18px;
            background: rgba(10,9,16,.82);
        }
        body.layout-scroll .views {
            position: static;
            justify-content: flex-start;
            margin-bottom: 12px;
        }
        body.layout-scroll .name { font-size: 21px; }
        body.layout-scroll .loc { margin-top: 4px; }
        body.layout-scroll .bio { margin-top: 10px; }
        body.layout-scroll .socials { margin-top: 14px; }
        body.layout-scroll .projects {
            display: flex;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,.08);
        }
        body.layout-scroll .music { margin-top: 16px; }

        body.layout-showcase .wrap {
            max-width: 430px;
        }
        body.layout-showcase .card {
            border-radius: 20px;
            padding: 28px 24px 22px;
            background: rgba(14,11,21,.72);
            border: 1px solid rgba(255,255,255,.14);
        }
        body.layout-showcase .avatar {
            width: 84px;
            height: 84px;
            margin: 2px auto 12px;
            border-width: 2px;
        }
        body.layout-showcase .name {
            font-size: 22px;
        }
        body.layout-showcase .socials {
            margin-top: 16px;
            gap: 10px;
        }
        body.layout-showcase .links,
        body.layout-showcase .projects {
            display: none !important;
        }

    </style>
</head>
<body>
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
                <feTurbulence id="name-turb" type="turbulence" baseFrequency="0.008 1.1" numOctaves="1" seed="1" result="noise"></feTurbulence>
                <feDisplacementMap id="name-disp" in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
        </defs>
    </svg>
    <div class="boot-loader" id="bootLoader"><div class="boot-inner"><span class="boot-ring"></span>Loading profile <span id="entrySymbol">✦</span>...</div></div>
    <div id="entry-gate" aria-hidden="true"><div id="entry-gate-symbol">✦</div><div id="entry-gate-hint">click to enter</div></div>
    <div id="bg"></div><video id="bg-video" autoplay muted loop playsinline></video><div id="bg-overlay"></div><div id="bg-fx" aria-hidden="true"></div>
    <canvas id="cursor-canvas" aria-hidden="true"></canvas>
    <div class="wrap">
        <div class="card" id="card">
            <div class="views"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg><span id="views">0</span></div>
            <div class="avatar" id="avatar">?</div>
            <div class="name"><span class="name-wrap"><span id="name">Name</span><span class="name-tip" id="nameTip"></span></span></div>
            <div class="handle" id="handle">@you</div>
            <div class="claim-notice" id="claimNotice"></div>
            <div class="loc" id="loc"></div>
            <div class="bio" id="bio"></div>
            <div class="socials" id="socials"></div>
            <div class="links" id="links"></div>
            <div class="projects" id="projects"></div>
            <div class="music" id="music" style="display:none">
                <img id="mArt" src="" alt="" />
                <div class="mi"><div class="mt" id="mTitle"></div><div class="ma" id="mArtist"></div><div class="prog"><span id="mProg"></span></div></div>
                <button class="playbtn" id="mBtn"><svg id="mPlay" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg><svg id="mPause" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg></button>
                <audio id="mAudio" preload="metadata"></audio>
            </div>
            <div class="brand">mourn<span>.wtf</span></div>
        </div>
    </div>

    <script>
        function loadJson(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key) || fallback);
            } catch {
                return JSON.parse(fallback);
            }
        }

        function getPathHandle() {
            const q = new URLSearchParams(location.search || '');
            const qu = (q.get('u') || '').trim();
            if (qu) return decodeURIComponent(qu);
            const parts = location.pathname.split('/').filter(Boolean);
            if (!parts.length || parts[0] === 'profile') {
                const s = loadJson('mourn.session', 'null');
                return (s && s.username) ? s.username : 'profile';
            }
            return decodeURIComponent(parts[0]);
        }

        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        const handle = getPathHandle();
        const profiles = loadJson('mourn.profiles', '{}');
        const hasLocalProfile = !!profiles[handle];
        const localProfile = profiles[handle] || {};

        function applyProfile(source, isUnclaimedProfile) {
            const stored = source || {};
            window.PROFILE = {
                handle,
                layout: stored.layout || 'scroll',
                displayName: stored.displayName || handle,
                bio: stored.bio || '',
                statusText: stored.statusText || '',
                nameTooltip: stored.nameTooltip || '',
                entrySymbol: stored.entrySymbol || '✦',
                background: stored.background || '',
                avatar: stored.avatar || '',
                cursor: stored.cursor || '',
                location: stored.location || '',
                colors: {
                    accent: stored.colors?.accent || '#8b5cf6',
                    text: stored.colors?.text || '#f4f2f8',
                    icon: stored.colors?.icon || '#f4f2f8',
                    bg: stored.colors?.bg || '#08070c',
                    bgFx: stored.colors?.bgFx || '#8b5cf6',
                    primary: stored.colors?.primary || '#171717',
                    secondary: stored.colors?.secondary || '#000000',
                    useGradient: !!stored.colors?.useGradient,
                },
                ui: {
                    opacity: typeof stored.ui?.opacity === 'number' ? stored.ui.opacity : 78,
                    blur: typeof stored.ui?.blur === 'number' ? stored.ui.blur : 20,
                    bgEffect: stored.ui?.bgEffect || 'none',
                    usernameEffect: stored.ui?.usernameEffect || 'none',
                    discordPresence: !!stored.ui?.discordPresence,
                    locVisible: stored.ui?.locVisible !== false,
                    glowUsername: stored.ui?.glowUsername !== false,
                    glowSocials: stored.ui?.glowSocials !== false,
                    glowBadges: !!stored.ui?.glowBadges,
                    monoIcons: !!stored.ui?.monoIcons,
                    animatedTitle: !!stored.ui?.animatedTitle,
                    swapBoxColors: !!stored.ui?.swapBoxColors,
                    cardTilt: typeof stored.ui?.cardTilt === 'number' ? stored.ui.cardTilt : 10,
                    fxDensity: typeof stored.ui?.fxDensity === 'number' ? stored.ui.fxDensity : 100,

                    var open0 = document.createElement('a');
                    open0.className = 'contact-btn';
                    open0.href = safeUrl(c0.url);
                    open0.target = '_blank';
                    open0.rel = 'noopener noreferrer';
                    open0.style.marginTop = '12px';
                    open0.textContent = 'open';
                    contactPrimary.appendChild(open0);
                }
                contacts.slice(1).forEach(function (c) {
                    var box = document.createElement('div');
                    box.className = 'contact-secondary';
                    box.innerHTML = '<div style="display:flex;align-items:center;gap:10px"><span style="width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center">' + icon(c.platform || '') + '</span><div style="font-weight:700">' + (c.handle || c.platform || 'contact') + '</div></div><div style="font-size:12px;color:rgba(255,255,255,.5)">' + (c.desc || '') + '</div>';
                    if (safeUrl(c.url)) {
                        var oa = document.createElement('a');
                        oa.className = 'contact-btn';
                        oa.href = safeUrl(c.url);
                        oa.target = '_blank';
                        oa.rel = 'noopener noreferrer';
                        oa.textContent = 'open';
                        oa.style.marginTop = '8px';
                        box.appendChild(oa);
                    }
                    contactGrid.appendChild(box);
                });
            }

            var song = P.song || {};
            document.getElementById('music-title').textContent = song.title || 'Untitled';
            document.getElementById('music-artist').textContent = song.artist || '';
            setImgWithFallback(document.getElementById('music-art'), song.art, universalLogo);
            var audio = document.getElementById('audio-element');
            if (song.url) audio.src = safeUrl(song.url);
            var progress = document.getElementById('progress-bar');
            var progressWrap = document.getElementById('progress-container');
            var currentTime = document.getElementById('current-time');
            var duration = document.getElementById('duration');
            var playBtn = document.getElementById('play-btn');
            var musicWidget = document.querySelector('.music-widget');
            if (musicWidget) musicWidget.style.display = 'none';
            if (playBtn) playBtn.style.display = 'none';
            audio.addEventListener('loadedmetadata', function () {
                var s = isNaN(audio.duration) ? 0 : audio.duration;
                duration.textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
            });
            audio.addEventListener('timeupdate', function () {
                if (!audio.duration) return;
                var s = audio.currentTime;
                currentTime.textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
                progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
            });
            progressWrap.addEventListener('click', function (e) {
                var rect = progressWrap.getBoundingClientRect();
                var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                if (audio.duration) audio.currentTime = ratio * audio.duration;
            });
            autoplayBackgroundAudio(audio);

            var tiltCards = {
                2: document.getElementById('tilt-card'),
                3: document.getElementById('projects-tilt-card'),
                4: document.getElementById('contact-tilt-card')
            };
            function resetTiltCards() {
                Object.keys(tiltCards).forEach(function (k) {
                    var card = tiltCards[k];
                    if (card) card.style.transform = 'rotateY(0deg) rotateX(0deg)';
                });
            }
            resetTiltCards();

            applyProfileTheme(P);
        }

        Promise.all([
            resolveAssetRef(P.background),
            resolveAssetRef(P.avatar),
            resolveAssetRef(P.cursor),
            resolveAssetRef(P.song && P.song.art),
            resolveAssetRef(P.song && P.song.url)
        ]).then(function (resolved) {
            P.background = resolved[0] || P.background;
            P.avatar = resolved[1] || P.avatar;
            P.cursor = resolved[2] || P.cursor;
            if (!P.song) P.song = {};
            P.song.art = resolved[3] || P.song.art;
            P.song.url = resolved[4] || P.song.url;

            if (P.colors && /^#[0-9a-fA-F]{6}$/.test(P.colors.accent || '')) {
                document.documentElement.style.setProperty('--accent', P.colors.accent);
            }

            if (P.cursor) {
                var cu = safeUrl(P.cursor);
                if (cu) document.body.style.cursor = 'url("' + cu.replace(/"/g, '') + '"), auto';
            }

            var bg = safeUrl(P.background);
            if (bg) {
                if (/\.(mp4|webm|mov)(\?|$)/i.test(bg)) {
                    var v = document.getElementById('bg-video');
                    v.src = bg;
                    v.style.display = 'block';
                } else {
                    document.getElementById('bg').style.backgroundImage = 'url("' + bg.replace(/"/g, '') + '")';
                }
            }

            var av = safeUrl(P.avatar), ae = document.getElementById('avatar');
            if (av) {
                ae.style.background = 'center/cover no-repeat url("' + av.replace(/"/g, '') + '")';
                ae.textContent = '';
            } else {
                ae.textContent = ((P.displayName || '?')[0] || '?').toUpperCase();
            }

            document.getElementById('name').textContent = P.displayName || P.handle || 'profile';
            var entryNode = document.getElementById('entrySymbol');
            if (entryNode) entryNode.textContent = P.entrySymbol || '✦';
            if (document.getElementById('nameTip')) {
                document.getElementById('nameTip').textContent = P.nameTooltip || '';
                document.getElementById('nameTip').style.display = P.nameTooltip ? '' : 'none';
            }
            document.getElementById('handle').textContent = '@' + (P.handle || P.displayName || 'you');
            var claimNotice = document.getElementById('claimNotice');
            if (claimNotice) {
                if (P.isUnclaimedProfile) {
                    claimNotice.style.display = 'block';
                    claimNotice.innerHTML = 'This username is not claimed yet. <a href="/signup?u=' + encodeURIComponent(P.handle || '') + '">Click here to claim it.</a>';
                } else {
                    claimNotice.style.display = 'none';
                    claimNotice.textContent = '';
                }
            }
            var statusLine = P.statusText || P.location || ('@' + (P.handle || ''));
            document.getElementById('loc').textContent = statusLine;
            if (P.ui && P.ui.locVisible === false) {
                document.getElementById('loc').style.display = 'none';
            }
            if (P.ui && P.ui.statusTypewriter) {
                document.getElementById('loc').classList.add('typewriter');
                initTypewriter(document.getElementById('loc'), statusLine, 78);
            } else {
                document.getElementById('loc').classList.remove('typewriter');
            }
            document.getElementById('bio').textContent = P.bio || '';
            if (P.isUnclaimedProfile && !P.bio) {
                document.getElementById('bio').textContent = 'No profile here yet. Claim this username to create it.';
            }
            document.getElementById('views').textContent = P.views || 0;

            document.body.classList.remove('layout-basic', 'layout-minimal', 'layout-scroll');
            var layoutName = 'showcase';
            document.body.classList.add('layout-' + layoutName);

            if (layoutName === 'scroll') {
                renderExactScrollTemplate(P);
                finishBoot();
                return;
            }

            var soc = document.getElementById('socials');
            (P.contacts || []).concat(P.platforms || []).forEach(function (c) {
                var u = safeUrl(c.url);
                if (!u) return;
                var a = document.createElement('a');
                a.className = 'social';
                a.href = u;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = c.platform || '';
                a.innerHTML = icon(c.platform);
                if (P.ui && P.ui.monoIcons) {
                    a.style.filter = 'grayscale(1) brightness(1.45)';
                    a.style.color = P.colors && P.colors.icon ? P.colors.icon : '';
                } else if (P.colors && P.colors.icon) {
                    a.style.color = P.colors.icon;
                }
                soc.appendChild(a);
            });

            var projects = document.getElementById('projects');
            var links = document.getElementById('links');
            var sourceList = (Array.isArray(P.projects) && P.projects.length) ? P.projects : (Array.isArray(P.links) ? P.links : []);
            var list = normalizeProfileLinks(sourceList);
            if (list.length) {
                projects.style.display = (layoutName === 'scroll') ? 'flex' : 'none';
                links.style.display = (layoutName === 'minimal') ? 'flex' : 'none';
                projects.innerHTML = '';
                links.innerHTML = '';
                list.forEach(function (item) {
                    var safe = safeUrl(item.url) || '#';

                    var linkScroll = document.createElement('a');
                    linkScroll.className = 'proj';
                    linkScroll.href = safe;
                    linkScroll.target = '_blank';
                    linkScroll.rel = 'noopener noreferrer';
                    linkScroll.textContent = item.name || item.url || 'Link';
                    projects.appendChild(linkScroll);

                    var linkMinimal = document.createElement('a');
                    linkMinimal.className = 'link';
                    linkMinimal.href = safe;
                    linkMinimal.target = '_blank';
                    linkMinimal.rel = 'noopener noreferrer';
                    var left = document.createElement('span');
                    left.textContent = item.name || item.url || 'Link';
                    var right = document.createElement('span');
                    right.className = 'lu';
                    right.textContent = '↗';
                    linkMinimal.appendChild(left);
                    linkMinimal.appendChild(right);
                    links.appendChild(linkMinimal);
                });
            } else {
                if (layoutName === 'scroll') {
                    projects.style.display = 'flex';
                    projects.innerHTML = '<div class="proj-empty">No projects yet.</div>';
                } else {
                    projects.style.display = 'none';
                }
                links.style.display = 'none';
            }

            var song = P.song || {};
            if (song.url) {
                var m = document.getElementById('music');
                m.style.display = 'none';
                setImgWithFallback(document.getElementById('mArt'), song.art, universalLogo);
                document.getElementById('mTitle').textContent = song.title || 'Untitled';
                document.getElementById('mArtist').textContent = song.artist || '';
                var audio = document.getElementById('mAudio');
                if (song.url) audio.src = safeUrl(song.url);
                var play = document.getElementById('mPlay'), pause = document.getElementById('mPause'), prog = document.getElementById('mProg');
                var btn = document.getElementById('mBtn');
                if (btn) btn.style.display = 'none';
                audio.addEventListener('timeupdate', function () {
                    if (audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
                });
                audio.addEventListener('ended', function () {
                    play.style.display = 'block';
                    pause.style.display = 'none';
                });
                setupEntryGate(P, function () { autoplayBackgroundAudio(audio); });
            } else {
                setupEntryGate(P);
            }

            initCardTilt(document.getElementById('card'), P.ui && typeof P.ui.cardTilt === 'number' ? P.ui.cardTilt : 10);
            applyNameNoise(!!(P.ui && P.ui.nameNoise), document.getElementById('name'));
            initCursorSparkle(!!(P.ui ? P.ui.cursorSparkle : true));

            if (layoutName === 'basic') {
                var card = document.getElementById('card');
                document.addEventListener('mousemove', function (e) {
                    var r = card.getBoundingClientRect();
                    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                    var rx = (e.clientY - cy) / -40, ry = (e.clientX - cx) / 40;
                    card.style.transform = 'rotateX(' + Math.max(-8, Math.min(8, rx)) + 'deg) rotateY(' + Math.max(-8, Math.min(8, ry)) + 'deg)';
                });
                document.addEventListener('mouseleave', function () { card.style.transform = 'rotateX(0) rotateY(0)'; });
            }

            applyProfileTheme(P);
            finishBoot();
        }).catch(function () {
            finishBoot();
        });
        });
    </script>
