        :root { --accent: #8b5cf6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

            justify-content: center;

            overflow-x: hidden;
        }
        .boot-loader {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #08070c;
            display: grid;
            place-items: center;
            transition: opacity .28s ease;
        }
        .boot-loader.hide {

            pointer-events: none;
        }
        .boot-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f4f2f8;
            font-weight: 700;
            letter-spacing: -.01em;
        }
        .boot-ring {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);

            animation: spin .8s linear infinite;

        #bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-size: cover;
            background-position: center;
            filter: brightness(.35) saturate(1.1);

        #bg-video {
            position: fixed;
            inset: 0;
            z-index: -3;
            width: 100%;
            height: 100%;

            background: rgba(15,13,22,.66);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.1);

            padding: 30px 26px 24px;

        .views {

            align-items: center;

            font-size: 12px;

        .proj {

        body.layout-minimal .card {

    <script>
        function loadJson(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key) || fallback);
            } catch {
                return JSON.parse(fallback);
            }
        }

        function getPathHandle() {
            const parts = location.pathname.split('/').filter(Boolean);
            if (!parts.length || parts[0] === 'profile') {
                const s = loadJson('mourn.session', 'null');
                return (s && s.username) ? s.username : 'profile';
            }
            return decodeURIComponent(parts[0]);
        }

        const handle = getPathHandle();
        const profiles = loadJson('mourn.profiles', '{}');
        const stored = profiles[handle] || {};

        window.PROFILE = {
            handle,
            layout: stored.layout || 'basic',
            displayName: stored.displayName || handle,
            bio: stored.bio || '',
            background: stored.background || '',
            avatar: stored.avatar || '',
            cursor: stored.cursor || '',
            location: stored.location || '',
            colors: stored.colors || { accent: '#8b5cf6' },
            views: typeof stored.views === 'number' ? stored.views : 0,
            song: stored.song || { title: '', artist: '', art: '', url: '' },
            platforms: Array.isArray(stored.platforms) ? stored.platforms : [],
            projects: Array.isArray(stored.projects) ? stored.projects : [],
            contacts: Array.isArray(stored.contacts) ? stored.contacts : [],
        };

        if (profiles[handle]) {
            profiles[handle].views = (profiles[handle].views || 0) + 1;
            localStorage.setItem('mourn.profiles', JSON.stringify(profiles));
            window.PROFILE.views = profiles[handle].views;
        }
    </script>

        var MEDIA_STORE = 'assets';
        var BOOT_MIN_MS = 700;
        var bootStartedAt = Date.now();

        function finishBoot() {
            var remaining = BOOT_MIN_MS - (Date.now() - bootStartedAt);
            var delay = remaining > 0 ? remaining : 0;
            setTimeout(function () {
                var loader = document.getElementById('bootLoader');
                if (!loader) return;
                loader.classList.add('hide');
                setTimeout(function () { loader.remove(); }, 320);
            }, delay);
        }

        function openMediaDb() {
            return new Promise(function (resolve, reject) {
                var req = indexedDB.open(MEDIA_DB, 1);
                req.onupgradeneeded = function () {
                    var db = req.result;
                    if (!db.objectStoreNames.contains(MEDIA_STORE)) {
                        db.createObjectStore(MEDIA_STORE);
                    }
                };
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error); };
            });
        }

        function loadMediaBlob(key) {
            return openMediaDb().then(function (db) {
                return new Promise(function (resolve, reject) {
                    var tx = db.transaction(MEDIA_STORE, 'readonly');
                    var req = tx.objectStore(MEDIA_STORE).get(key);
                    req.onsuccess = function () { resolve(req.result || null); };
                    req.onerror = function () { reject(req.error); };
                });
            });
        }

        function resolveAssetRef(url) {
            if (!url || typeof url !== 'string' || !url.startsWith('asset:')) {
                return Promise.resolve(url || '');
            }
            var key = url.slice(6);
            return loadMediaBlob(key).then(function (blob) {
                if (!blob) return '';
                return URL.createObjectURL(blob);
            }).catch(function () {
                return '';
            });
        }

        function safeUrl(u) {
            if (!u) return '';
            if (u.indexOf('blob:') === 0) return u;
            if (u.charAt(0) === '/' && u.charAt(1) !== '/') return u;
            try {
                var x = new URL(u);
                return (x.protocol === 'http:' || x.protocol === 'https:' || x.protocol === 'mailto:') ? u : '';

                return '';

        }

                '.widget-dots-nav{display:flex;gap:8px;margin-top:12px;justify-content:center;margin-bottom:24px}.nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}.nav-dot.active{background:#fff;transform:scale(1.2)}',
                '.music-widget{border-radius:24px;padding:18px 24px;display:flex;align-items:center;width:100%;gap:16px}.music-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover}',
                '.music-timeline-container{flex-grow:1;display:flex;align-items:center;gap:12px}.progress-container{flex-grow:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;position:relative;cursor:pointer}.progress-bar{height:100%;width:0;background:#fff;border-radius:2px}',
                '.control-btn{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer}.play-pause-btn{color:#fff}',
                '.projects-title,.contact-title{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}.projects-subtext,.contact-subtext{font-size:15px;color:rgba(255,255,255,.5)}',
                '.projects-list{display:flex;flex-direction:column;gap:14px;width:100%}.project-item{display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:16px;padding:20px 22px;text-decoration:none;color:inherit}',
                '.project-name{font-size:18px;font-weight:700}.project-url{font-size:13px;color:rgba(255,255,255,.5)}',
                '.contact-primary{border-radius:18px;padding:22px;margin-bottom:14px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.contact-secondary{border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px}',
                '.contact-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;text-decoration:none}',
                '@media(max-width:520px){.profile-card,.projects-card,.contact-card{padding:24px 16px}.profile-title{font-size:36px}.projects-title,.contact-title{font-size:30px}.contact-grid{grid-template-columns:1fr}}'
            ].join('');
            document.head.appendChild(style);

            document.body.innerHTML = '' +
                '<div id="entry-overlay"><div id="entry-text">click</div></div>' +
                '<div id="scroll-wrapper">' +
                '  <section class="page-section active-page" id="page-1"><div id="first-page-view" class="scroll-animated active"><img src="" id="entry-image" alt=""><div class="scroll-hint-wrapper"><span class="scroll-hint">scroll for more</span><span class="scroll-arrow">↓</span></div></div></section>' +
                '  <section class="page-section" id="page-2"><div class="page-container scroll-animated fade-from-bottom"><div class="profile-card" id="tilt-card"><div class="card-top"><div class="view-counter"><span id="view-count">0</span></div></div><div class="profile-main"><h1 class="profile-title" id="main-display-name">profile</h1></div><div class="dynamic-widget" id="platform-widget"><div class="widget-left"><img src="" alt="Avatar" class="widget-avatar" id="widget-pfp"><div><div id="widget-display-name"></div><span id="widget-handle" class="widget-username-sub"></span></div></div><div class="platform-label-tag" id="widget-platform-tag"></div><a href="#" target="_blank" class="view-profile-action-btn" id="widget-action-btn">View Profile ↗</a></div><div class="widget-dots-nav" id="widget-dots"></div><div class="music-widget"><img src="" alt="Album Art" class="music-avatar" id="music-art"><div style="min-width:160px"><h4 id="music-title"></h4><span class="music-artist" id="music-artist"></span></div><div class="music-timeline-container"><span id="current-time">0:00</span><div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div><span id="duration">0:00</span></div><button class="control-btn play-pause-btn" id="play-btn">▶</button><audio id="audio-element" preload="metadata"></audio></div></div></div><div class="scroll-hint-wrapper"><span class="scroll-hint">scroll for more</span><span class="scroll-arrow">↓</span></div></section>' +
                '  <section class="page-section" id="page-3"><div class="page-container scroll-animated fade-from-bottom"><div class="projects-card" id="projects-tilt-card"><h2 class="projects-title">Projects</h2><p class="projects-subtext">Websites I\'ve built</p><div class="projects-list" id="projects-list"></div></div></div><div class="scroll-hint-wrapper"><span class="scroll-hint">scroll for more</span><span class="scroll-arrow">↓</span></div></section>' +
                '  <section class="page-section" id="page-4"><div class="page-container scroll-animated fade-from-bottom"><div class="contact-card" id="contact-tilt-card"><h2 class="contact-title">contact</h2><p class="contact-subtext" id="contact-subtext">open for collabs, questions, or just a hello.</p><div id="contact-primary"></div><div class="contact-grid" id="contact-grid"></div></div></div></section>' +
                '</div>';

            var currentPage = 1;
            var totalPages = 4;
            var isScrolling = false;
            var isUnlocked = false;
            var pages = [1, 2, 3, 4].map(function (n) { return document.getElementById('page-' + n); });
            var animatedPages = pages.map(function (page) { return page.querySelector('.scroll-animated'); });

            function goToPage(pageIndex) {
                if (pageIndex < 1 || pageIndex > totalPages || pageIndex === currentPage) return;
                isScrolling = true;
                var goingDown = pageIndex > currentPage;
                var prevPage = currentPage;
                currentPage = pageIndex;

                pages.forEach(function (page, idx) {
                    page.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.25, 1)';
                    page.style.transform = 'translateY(' + ((idx + 1 - currentPage) * 100) + 'vh)';
                    page.classList.toggle('active-page', idx + 1 === currentPage);
                });

                var leavingAnim = animatedPages[prevPage - 1];
                var enteringAnim = animatedPages[currentPage - 1];
                if (leavingAnim && enteringAnim) {
                    if (goingDown) {
                        leavingAnim.classList.remove('active', 'fade-from-bottom');
                        leavingAnim.classList.add('fade-from-top');
                        enteringAnim.classList.remove('fade-from-top');
                        enteringAnim.classList.add('fade-from-bottom');
                    } else {
                        leavingAnim.classList.remove('active', 'fade-from-top');
                        leavingAnim.classList.add('fade-from-bottom');
                        enteringAnim.classList.remove('fade-from-bottom');
                        enteringAnim.classList.add('fade-from-top');
                    }
                    enteringAnim.offsetHeight;
                    enteringAnim.classList.add('active');
                }
                setTimeout(function () { isScrolling = false; }, 2000);
            }

            window.addEventListener('wheel', function (e) {
                if (!isUnlocked || isScrolling) return;
                if (e.deltaY > 15) goToPage(currentPage + 1);
                else if (e.deltaY < -15) goToPage(currentPage - 1);
            }, { passive: true });

            var touchStartY = 0;
            window.addEventListener('touchstart', function (e) { touchStartY = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('touchmove', function (e) {
                if (!isUnlocked || isScrolling) return;
                var diffY = touchStartY - e.touches[0].clientY;
                if (diffY > 40) goToPage(currentPage + 1);
                else if (diffY < -40) goToPage(currentPage - 1);
            }, { passive: true });

            var overlay = document.getElementById('entry-overlay');
            overlay.addEventListener('click', function () {
                overlay.classList.add('fade-out');
                isUnlocked = true;
                var audioAuto = document.getElementById('audio-element');
                if (audioAuto && audioAuto.src) audioAuto.play().catch(function () {});
            });

            var entryImage = document.getElementById('entry-image');
            var entrySrc = safeUrl(P.background) || safeUrl(P.avatar);
            if (entrySrc) entryImage.src = entrySrc;
            else entryImage.style.display = 'none';

            document.getElementById('main-display-name').textContent = P.displayName || P.handle || 'profile';
            document.getElementById('view-count').textContent = String(P.views || 0);
            if (P.bio) document.getElementById('contact-subtext').textContent = P.bio;

            var platforms = (Array.isArray(P.platforms) ? P.platforms : []).filter(function (x) { return x && (x.platform || x.url || x.handle); });
            var dotsWrap = document.getElementById('widget-dots');
            var widget = document.getElementById('platform-widget');
            if (!platforms.length) {
                widget.style.display = 'none';
                dotsWrap.style.display = 'none';
            } else {
                var activePlatformIndex = 0;
                var rotationInterval = null;

                function paintPlatform(i) {
                    var d = platforms[i];
                    document.getElementById('widget-pfp').src = safeUrl(d.pfp || P.avatar || P.background) || '';
                    document.getElementById('widget-display-name').textContent = d.displayName || P.displayName || P.handle || 'profile';
                    document.getElementById('widget-handle').textContent = d.handle || ('@' + (P.handle || ''));
                    document.getElementById('widget-platform-tag').textContent = d.platform || 'platform';
                    document.getElementById('widget-action-btn').href = safeUrl(d.url) || '#';
                    Array.from(dotsWrap.children).forEach(function (dot, idx) { dot.classList.toggle('active', idx === i); });
                    activePlatformIndex = i;
                }

                platforms.forEach(function (_, i) {
                    var dot = document.createElement('div');
                    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
                    dot.addEventListener('click', function () {
                        paintPlatform(i);
                        clearInterval(rotationInterval);
                        rotationInterval = setInterval(function () {
                            paintPlatform((activePlatformIndex + 1) % platforms.length);
                        }, 7000);
                    });
                    dotsWrap.appendChild(dot);
                });
                paintPlatform(0);
                rotationInterval = setInterval(function () {
                    paintPlatform((activePlatformIndex + 1) % platforms.length);
                }, 7000);
            }

            var list = Array.isArray(P.projects) ? P.projects : [];
            var projectsList = document.getElementById('projects-list');
            if (!list.length) {
                var ep = document.createElement('p');
                ep.textContent = 'No projects yet.';
                ep.style.cssText = 'color:rgba(255,255,255,.45);font-size:14px';
                projectsList.appendChild(ep);
            } else {
                list.forEach(function (pr) {
                    var a = document.createElement('a');
                    a.className = 'project-item';
                    a.href = safeUrl(pr.url) || '#';
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerHTML = '<div><div class="project-name">' + (pr.name || 'Link') + '</div><div class="project-url">' + ((pr.url || '').replace(/^https?:\/\//, '')) + '</div></div><span>↗</span>';
                    projectsList.appendChild(a);
                });
            }

            var contactPrimary = document.getElementById('contact-primary');
            var contactGrid = document.getElementById('contact-grid');
            var contacts = Array.isArray(P.contacts) ? P.contacts : [];
            if (contacts.length) {
                var c0 = contacts[0];
                contactPrimary.className = 'contact-primary';
                contactPrimary.innerHTML = '<div style="font-weight:700;font-size:16px">' + (c0.handle || c0.platform || 'contact') + '</div><div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:4px">' + (c0.desc || '') + '</div>';
                if (safeUrl(c0.url)) {
                    var open0 = document.createElement('a');
                    open0.className = 'contact-btn';
                    open0.href = safeUrl(c0.url);
                    open0.target = '_blank';
                    open0.rel = 'noopener noreferrer';
                    open0.style.marginTop = '12px';
                    open0.textContent = 'open';
                    contactPrimary.appendChild(open0);
                }
                contacts.slice(1).forEach(function (c) {
                    var box = document.createElement('div');
                    box.className = 'contact-secondary';
                    box.innerHTML = '<div style="font-weight:700">' + (c.handle || c.platform || 'contact') + '</div><div style="font-size:12px;color:rgba(255,255,255,.5)">' + (c.desc || '') + '</div>';
                    if (safeUrl(c.url)) {
                        var oa = document.createElement('a');
                        oa.className = 'contact-btn';
                        oa.href = safeUrl(c.url);
                        oa.target = '_blank';
                        oa.rel = 'noopener noreferrer';
                        oa.textContent = 'open';
                        oa.style.marginTop = '8px';
                        box.appendChild(oa);
                    }
                    contactGrid.appendChild(box);
                });
            }

            var song = P.song || {};
            document.getElementById('music-title').textContent = song.title || 'Untitled';
            document.getElementById('music-artist').textContent = song.artist || '';
            if (song.art) document.getElementById('music-art').src = safeUrl(song.art);
            var audio = document.getElementById('audio-element');
            if (song.url) audio.src = safeUrl(song.url);
            var progress = document.getElementById('progress-bar');
            var progressWrap = document.getElementById('progress-container');
            var currentTime = document.getElementById('current-time');
            var duration = document.getElementById('duration');
            var playBtn = document.getElementById('play-btn');
            playBtn.addEventListener('click', function () {
                if (audio.paused) {
                    audio.play().catch(function () {});
                    playBtn.textContent = '❚❚';
                } else {
                    audio.pause();
                    playBtn.textContent = '▶';
                }
            });
            audio.addEventListener('loadedmetadata', function () {
                var s = isNaN(audio.duration) ? 0 : audio.duration;
                duration.textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
            });
            audio.addEventListener('timeupdate', function () {
                if (!audio.duration) return;
                var s = audio.currentTime;
                currentTime.textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
                progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
            });
            progressWrap.addEventListener('click', function (e) {
                var rect = progressWrap.getBoundingClientRect();
                var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                if (audio.duration) audio.currentTime = ratio * audio.duration;
            });

            var tiltCards = {
                2: document.getElementById('tilt-card'),
                3: document.getElementById('projects-tilt-card'),
                4: document.getElementById('contact-tilt-card')
            };
            function resetTiltCards() {
                Object.keys(tiltCards).forEach(function (k) {
                    var card = tiltCards[k];
                    if (card) card.style.transform = 'rotateY(0deg) rotateX(0deg)';
                });
            }
            document.addEventListener('mousemove', function (e) {
                var card = tiltCards[currentPage];
                if (!card) return;
                var xAxis = (window.innerWidth / 2 - e.pageX) / 35;
                var yAxis = (window.innerHeight / 2 - e.pageY) / 35;
                resetTiltCards();
                card.style.transform = 'rotateY(' + xAxis + 'deg) rotateX(' + (-yAxis) + 'deg)';
            });
            document.addEventListener('mouseleave', resetTiltCards);
        }

        Promise.all([
            resolveAssetRef(P.background),
            resolveAssetRef(P.avatar),
            resolveAssetRef(P.cursor),
            resolveAssetRef(P.song && P.song.art),
            resolveAssetRef(P.song && P.song.url)
        ]).then(function (resolved) {
            P.background = resolved[0] || P.background;
            P.avatar = resolved[1] || P.avatar;
            P.cursor = resolved[2] || P.cursor;
            if (!P.song) P.song = {};
            P.song.art = resolved[3] || P.song.art;
            P.song.url = resolved[4] || P.song.url;

            if (P.colors && /^#[0-9a-fA-F]{6}$/.test(P.colors.accent || '')) {
                document.documentElement.style.setProperty('--accent', P.colors.accent);
            }

            if (P.cursor) {
                var cu = safeUrl(P.cursor);
                if (cu) document.body.style.cursor = 'url("' + cu.replace(/"/g, '') + '"), auto';
            }

            var bg = safeUrl(P.background);
            if (bg) {
                if (/\.(mp4|webm|mov)(\?|$)/i.test(bg)) {
                    var v = document.getElementById('bg-video');
                    v.src = bg;
                    v.style.display = 'block';
                } else {
                    document.getElementById('bg').style.backgroundImage = 'url("' + bg.replace(/"/g, '') + '")';
                }
            }

            var av = safeUrl(P.avatar), ae = document.getElementById('avatar');
            if (av) {
                ae.style.background = 'center/cover no-repeat url("' + av.replace(/"/g, '') + '")';
                ae.textContent = '';
            } else {
                ae.textContent = ((P.displayName || '?')[0] || '?').toUpperCase();
            }

            document.getElementById('name').textContent = P.displayName || P.handle || 'profile';
            document.getElementById('handle').textContent = '@' + (P.handle || P.displayName || 'you');
            document.getElementById('loc').textContent = P.location || ('@' + (P.handle || ''));
            document.getElementById('bio').textContent = P.bio || '';
            document.getElementById('views').textContent = P.views || 0;

            document.body.classList.remove('layout-basic', 'layout-minimal', 'layout-scroll');
            var layoutName = (P.layout || 'basic').toLowerCase();
            if (layoutName !== 'minimal' && layoutName !== 'scroll') layoutName = 'basic';
            document.body.classList.add('layout-' + layoutName);

            if (layoutName === 'scroll') {
                renderExactScrollTemplate(P);
                finishBoot();
                return;
            }

            var soc = document.getElementById('socials');
            (P.contacts || []).concat(P.platforms || []).forEach(function (c) {
                var u = safeUrl(c.url);
                if (!u) return;
                var a = document.createElement('a');
                a.className = 'social';
                a.href = u;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = c.platform || '';
                a.innerHTML = icon(c.platform);
                soc.appendChild(a);
            });

            var projects = document.getElementById('projects');
            var links = document.getElementById('links');
            var list = Array.isArray(P.projects) ? P.projects.filter(function (x) {
                return x && (x.name || x.url);
            }) : [];
            if (list.length) {
                projects.style.display = (layoutName === 'scroll') ? 'flex' : 'none';
                links.style.display = (layoutName === 'minimal') ? 'flex' : 'none';
                projects.innerHTML = '';
                links.innerHTML = '';
                list.forEach(function (item) {
                    var safe = safeUrl(item.url) || '#';

                    var linkScroll = document.createElement('a');
                    linkScroll.className = 'proj';
                    linkScroll.href = safe;
                    linkScroll.target = '_blank';
                    linkScroll.rel = 'noopener noreferrer';
                    linkScroll.textContent = item.name || item.url || 'Link';
                    projects.appendChild(linkScroll);

                    var linkMinimal = document.createElement('a');
                    linkMinimal.className = 'link';
                    linkMinimal.href = safe;
                    linkMinimal.target = '_blank';
                    linkMinimal.rel = 'noopener noreferrer';
                    var left = document.createElement('span');
                    left.textContent = item.name || item.url || 'Link';
                    var right = document.createElement('span');
                    right.className = 'lu';
                    right.textContent = '↗';
                    linkMinimal.appendChild(left);
                    linkMinimal.appendChild(right);
                    links.appendChild(linkMinimal);
                });
            } else {
                if (layoutName === 'scroll') {
                    projects.style.display = 'flex';
                    projects.innerHTML = '<div class="proj-empty">No projects yet.</div>';
                } else {
                    projects.style.display = 'none';
                }
                links.style.display = 'none';
            }

            var song = P.song || {};
            if (song.title || song.url) {
                var m = document.getElementById('music');
                m.style.display = 'flex';
                if (song.art) document.getElementById('mArt').src = safeUrl(song.art);
                document.getElementById('mTitle').textContent = song.title || 'Untitled';
                document.getElementById('mArtist').textContent = song.artist || '';
                var audio = document.getElementById('mAudio');
                if (song.url) audio.src = safeUrl(song.url);
                var play = document.getElementById('mPlay'), pause = document.getElementById('mPause'), prog = document.getElementById('mProg');
                document.getElementById('mBtn').addEventListener('click', function () {
                    if (audio.paused) {
                        audio.play();
                        play.style.display = 'none';
                        pause.style.display = 'block';
                    } else {
                        audio.pause();
                        play.style.display = 'block';
                        pause.style.display = 'none';
                    }
                });
                audio.addEventListener('timeupdate', function () {
                    if (audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
                });
                audio.addEventListener('ended', function () {
                    play.style.display = 'block';
                    pause.style.display = 'none';
                });
            }

            if (layoutName === 'basic') {
                var card = document.getElementById('card');
                document.addEventListener('mousemove', function (e) {
                    var r = card.getBoundingClientRect();
                    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                    var rx = (e.clientY - cy) / -40, ry = (e.clientX - cx) / 40;
                    card.style.transform = 'rotateX(' + Math.max(-8, Math.min(8, rx)) + 'deg) rotateY(' + Math.max(-8, Math.min(8, ry)) + 'deg)';
                });
                document.addEventListener('mouseleave', function () { card.style.transform = 'rotateX(0) rotateY(0)'; });
            }
            finishBoot();
        }).catch(function () {
            finishBoot();
        });
    </script>
